# No steam_app_id: Steam update checks are skipped; use reboot + manual sync.
query_protocol: bfbc2
exclude_dirs:
  # Per-server instance data (configs, maps, runtime state)
  - instance
  # custom dist data due to server modifications
  - dist
exclude_patterns:
  # to allow helper scripts to store their configs in the root of the repo
  - "/*.ini"